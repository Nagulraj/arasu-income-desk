<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143e36"><title>Arasu | Income Certificate Review</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="decision"><form id="decision-form"><div class="eyebrow">Officer's final decision</div><h2 id="decision-title"></h2><p id="decision-description"></p><label for="reason">Reason for decision <span class="required">*</span></label><textarea id="reason" rows="4" required minlength="12" maxlength="1000" placeholder="Describe the evidence reviewed and the reason for your decision…"></textarea><label class="check"><input id="verified" type="checkbox" required> I have reviewed the documents and take responsibility for this decision.</label><div class="dialog-actions"><button type="button" id="cancel-decision" class="secondary">Cancel</button><button class="primary" type="submit">Record decision</button></div></form></dialog><dialog id="document"><button class="close secondary" id="close-document" aria-label="Close">✕</button><div id="document-content"></div></dialog></body></html>
