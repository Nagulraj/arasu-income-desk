<!doctype html>
<html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143e36"><title>அரசு | வருமானச் சான்றிதழ் ஆய்வு</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><dialog id="decision"><form id="decision-form"><div class="eyebrow">அலுவலரின் இறுதி முடிவு</div><h2 id="decision-title"></h2><p id="decision-description"></p><label for="reason">முடிவிற்கான காரணம் <span class="required">*</span></label><textarea id="reason" rows="4" required minlength="12" maxlength="1000" placeholder="சரிபார்த்த ஆதாரங்களையும் முடிவிற்கான காரணத்தையும் எழுதவும்…"></textarea><label class="check"><input id="verified" type="checkbox" required> ஆவணங்களை ஆய்வு செய்தேன். இந்த முடிவிற்கு நான் பொறுப்பேற்கிறேன்.</label><div class="dialog-actions"><button type="button" id="cancel-decision" class="secondary">ரத்து செய்</button><button class="primary" type="submit">முடிவைப் பதிவு செய்</button></div></form></dialog><dialog id="document"><button class="close secondary" id="close-document" aria-label="மூடு">✕</button><div id="document-content"></div></dialog></body></html>
